<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img"><title>Architecture overview</title><desc>SDL design diagram. Editable source: sdl-design.drawio, page Architecture overview.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#60758b" stroke="#60758b" stroke-width="1.5" /></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758b" stroke-width="1.5" /></marker></defs><rect x="0" y="0" width="1600" height="1260" fill="white" /><text x="48" y="39.375" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="bold" stroke="none">SDL DESIGN / STATIC / 01</text><text x="48" y="98.25" font-family="Arial, sans-serif" font-size="30" fill="#16324f" text-anchor="start" font-weight="bold" stroke="none">Architecture overview</text><text x="48" y="142.0" font-family="Arial, sans-serif" font-size="16" fill="#526578" text-anchor="start" font-weight="normal" stroke="none">Build-time generation, runtime message exchange and associated services.</text><rect x="40" y="1100" width="1520" height="130" rx="9" fill="#fff9e9" stroke="#d1bb7e" stroke-width="1.5" /><text x="58" y="1130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Design notes</text><text x="58" y="1160.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Solid arrows show data or calls; dashed arrows show use of catalogue metadata. Colours: purple = generated code; blue = codec; green = service; amber = data; grey =</text><text x="58" y="1179.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">integration.</text><text x="58" y="1199.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Each language owns its message API. Transport framing, catalogue delivery and application decisions remain with the application.</text><rect x="60" y="200" width="310" height="130" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="78" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">SDL schemas</text><text x="78" y="260.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">.sdl files</text><text x="78" y="281.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Messages, enums, packages</text><text x="78" y="302.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Constants, aliases, wire</text><text x="78" y="323.36" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">options</text><rect x="600" y="200" width="380" height="130" rx="9" fill="#f0eafa" stroke="#8060ae" stroke-width="1.5" /><text x="618" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Python generator</text><text x="618" y="260.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Parse and resolve declarations</text><text x="618" y="281.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Validate types and dimensions</text><text x="618" y="302.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Emit selected language backends</text><rect x="1200" y="200" width="340" height="130" rx="9" fill="#f0eafa" stroke="#8060ae" stroke-width="1.5" /><text x="1218" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Generated bindings</text><text x="1218" y="260.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">C / Rust / Python / Java / Ada /</text><text x="1218" y="279.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">MATLAB</text><text x="1218" y="299.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Local types and schema metadata</text><text x="1218" y="319.4" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Specialized codecs where supported</text><polyline points="370,265.0 600,265.0" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="589.0,269.0 600,265.0 589.0,261.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="435.0" y="235.0" width="100" height="25" fill="#ffffff" /><text x="485.0" y="252.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">generate</text><polyline points="980,265.0 1200,265.0" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1189.0,269.0 1200,265.0 1189.0,261.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1014.0" y="235.0" width="152" height="25" fill="#ffffff" /><text x="1090.0" y="252.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">types + metadata</text><rect x="60" y="510" width="310" height="150" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="78" y="540" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Application</text><text x="78" y="570.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Creates and consumes values</text><text x="78" y="591.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Chooses filters and channels</text><text x="78" y="612.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Manages errors and lifetimes</text><rect x="600" y="510" width="380" height="150" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="618" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Codec runtime + prepared context</text><text x="618" y="570.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">description / prepare / encode / decode</text><text x="618" y="589.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Catalogue parsing and field-ID mapping</text><text x="618" y="609.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Validation and wire representation</text><text x="618" y="629.4" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Dynamic reading: C, Rust, Python</text><rect x="1200" y="510" width="340" height="150" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="1218" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Transport adapter</text><text x="1218" y="570.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">SDL2 catalogue at connection</text><text x="1218" y="589.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">opening</text><text x="1218" y="609.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Then message ID + positional values</text><text x="1218" y="629.4" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">S2PS/2 envelope when selected</text><polyline points="370,585.0 600,585.0" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="589.0,589.0 600,585.0 589.0,581.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="393.0" y="555.0" width="184" height="25" fill="#ffffff" /><text x="485.0" y="572.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">values / codec calls</text><polyline points="980,585.0 1200,585.0" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1189.0,589.0 1200,585.0 1189.0,581.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1002.0" y="555.0" width="176" height="25" fill="#ffffff" /><text x="1090.0" y="572.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">catalogue / payload</text><polyline points="1370.0,330 1370,420 790,420 790.0,510" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="786.0,499.0 790.0,510 794.0,499.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="1012.0" y="390.0" width="136" height="25" fill="#ffffff" /><text x="1080.0" y="407.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">local metadata</text><rect x="60" y="870" width="310" height="145" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="78" y="900" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Filter service</text><text x="78" y="930.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Prepared catalogue-bound</text><text x="78" y="949.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">predicates</text><text x="78" y="969.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Object or targeted wire</text><text x="78" y="989.4" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">evaluation</text><text x="78" y="1009.2" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Status returned to application</text><rect x="600" y="870" width="380" height="145" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="618" y="900" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Recording service</text><text x="618" y="930.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Store raw payloads and catalogues</text><text x="618" y="951.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Inspect, validate, convert and replay</text><text x="618" y="972.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">MCAP / SDL USER0 PCAPNG</text><rect x="1200" y="870" width="340" height="145" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="1218" y="900" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Wireshark integration</text><text x="1218" y="930.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Native C dissector</text><text x="1218" y="951.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">UDP flow catalogue cache</text><text x="1218" y="972.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">SDL USER0 recording inspection</text><polyline points="790.0,660 790,780 215,780 215.0,870" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="211.0,859.0 215.0,870 219.0,859.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="386.5" y="750.0" width="232" height="25" fill="#ffffff" /><text x="502.5" y="767.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">catalogue + values / bytes</text><polyline points="790.0,660 790.0,870" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="786.0,859.0 790.0,870 794.0,859.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="694.0" y="735.0" width="192" height="25" fill="#ffffff" /><text x="790.0" y="752.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">catalogue + raw bytes</text><polyline points="1370.0,660 1370.0,870" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1366.0,859.0 1370.0,870 1374.0,859.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1320.0" y="735.0" width="100" height="25" fill="#ffffff" /><text x="1370.0" y="752.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">capture</text></svg>