<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img"><title>Reading, validation and timed replay</title><desc>SDL design diagram. Editable source: sdl-design.drawio, page Reading, validation and timed replay.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#60758b" stroke="#60758b" stroke-width="1.5" /></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758b" stroke-width="1.5" /></marker></defs><rect x="0" y="0" width="1600" height="1260" fill="white" /><text x="48" y="39.375" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="bold" stroke="none">SDL DESIGN / DYNAMIC / 07</text><text x="48" y="98.25" font-family="Arial, sans-serif" font-size="30" fill="#16324f" text-anchor="start" font-weight="bold" stroke="none">Reading, validation and timed replay</text><text x="48" y="142.0" font-family="Arial, sans-serif" font-size="16" fill="#526578" text-anchor="start" font-weight="normal" stroke="none">Selected records are delivered in file order with unchanged payloads.</text><rect x="40" y="1100" width="1520" height="130" rx="9" fill="#fff9e9" stroke="#d1bb7e" stroke-width="1.5" /><text x="58" y="1130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Design notes</text><text x="58" y="1160.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">The CLI validates the full file before replay; direct API calls require an explicit preflight when needed. Reader iteration alone does not certify an unread suffix.</text><text x="58" y="1179.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Paced replay uses monotonic deadlines and log time; speed=0 skips waits. Publish time and sequence remain intact. Decreasing paced times or callback errors stop replay.</text><rect x="40" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="58" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Application / CLI</text><polyline points="160,235 160,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="350" y="175" width="240" height="60" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="368" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Recording reader</text><polyline points="470,235 470,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="680" y="175" width="240" height="60" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="698" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Replay scheduler</text><polyline points="800,235 800,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="1010" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="1028" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Consumer callback</text><polyline points="1130,235 1130,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="1320" y="175" width="240" height="60" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="1338" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Language codec</text><polyline points="1440,235 1440,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><polyline points="160,275 470,275" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="459.0,279.0 470,275 459.0,271.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="191.0" y="245.0" width="248" height="25" fill="#ffffff" /><text x="315.0" y="262.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">1. validate file (preflight)</text><polyline points="470,320 522,320 522,344 470,344" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="481.0,340.0 470,344 481.0,348.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="532" y="311" width="290" height="42" fill="#ffffff" /><text x="540" y="328.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Scan to EOF; check container CRCs;</text><text x="540" y="346.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">dynamically validate payloads</text><polyline points="470,380 160,380" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="171.0,376.0 160,380 171.0,384.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="179.0" y="350.0" width="272" height="25" fill="#ffffff" /><text x="315.0" y="367.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">message count / recording error</text><polyline points="160,430 470,430" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="459.0,434.0 470,430 459.0,426.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="131.0" y="400.0" width="368" height="25" fill="#ffffff" /><text x="315.0" y="417.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">2. select topics and [start, end) log times</text><polyline points="160,480 800,480" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="789.0,484.0 800,480 789.0,476.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="324.0" y="450.0" width="312" height="25" fill="#ffffff" /><text x="480.0" y="467.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">3. replay(iterator, callback, speed)</text><rect x="40" y="530" width="1520" height="34" fill="#eef3f8" /><text x="48" y="552.25" font-family="Arial, sans-serif" font-size="14" fill="#35526e" text-anchor="start" font-weight="bold" stroke="none">FOR EACH SELECTED RECORD</text><polyline points="800,595 470,595" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="481.0,591.0 470,595 481.0,599.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="579.0" y="565.0" width="112" height="25" fill="#ffffff" /><text x="635.0" y="582.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">next record</text><polyline points="470,645 800,645" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="789.0,649.0 800,645 789.0,641.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="487.0" y="615.0" width="296" height="25" fill="#ffffff" /><text x="635.0" y="632.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">raw payload + channel + timestamps</text><polyline points="800,695 852,695 852,719 800,719" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="811.0,715.0 800,719 811.0,723.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="862" y="686" width="290" height="42" fill="#ffffff" /><text x="870" y="703.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Deadline = origin + delta / speed</text><text x="870" y="721.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Wait only when speed &gt; 0</text><polyline points="800,760 1130,760" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1119.0,764.0 1130,760 1119.0,756.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="877.0" y="730.0" width="176" height="25" fill="#ffffff" /><text x="965.0" y="747.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">4. callback(record)</text><polyline points="1130,810 1440,810" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1429.0,814.0 1440,810 1429.0,806.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1137.0" y="780.0" width="296" height="25" fill="#ffffff" /><text x="1285.0" y="797.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">5. decode if consumer needs values</text><polyline points="1440,860 1130,860" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="1141.0,856.0 1130,860 1141.0,864.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="1189.0" y="830.0" width="192" height="25" fill="#ffffff" /><text x="1285.0" y="847.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">typed / dynamic value</text><polyline points="1130,910 1182,910 1182,934 1130,934" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1141.0,930.0 1130,934 1141.0,938.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1192" y="901" width="290" height="42" fill="#ffffff" /><text x="1200" y="918.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Run existing analysis</text><text x="1200" y="936.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Return or propagate an error</text><polyline points="1130,975 800,975" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="811.0,971.0 800,975 811.0,979.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="881.0" y="945.0" width="168" height="25" fill="#ffffff" /><text x="965.0" y="962.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">callback completed</text><polyline points="800,1030 160,1030" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="171.0,1026.0 160,1030 171.0,1034.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="336.0" y="1000.0" width="288" height="25" fill="#ffffff" /><text x="480.0" y="1017.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">delivered count after EOF / error</text></svg>