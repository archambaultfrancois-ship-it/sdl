[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ose"
version = "0.1.0"
description = "Executable SDL2 component graphs with per-subscription delivery policies"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
recording = ["mcap==1.5.0"]
sync = ["inotify-simple>=1.3.5,<3"]

[project.scripts]
ose-ctl = "ose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/ose/sdk/c" = ["sdk/c/ose_component.h", "sdk/c/ose_component.c", "sdk/c/ose_callbacks.h", "sdk/c/ose_callbacks.c"]
"share/ose/sdk/rust" = ["sdk/rust/Cargo.toml"]
"share/ose/sdk/rust/src" = ["sdk/rust/src/lib.rs"]

"share/ose/sdk/client/c" = ["sdk/client/c/ose_client.h", "sdk/client/c/ose_client_raw.h", "sdk/client/c/ose_client.c", "sdk/client/c/ose_parameters.h"]
"share/ose/sdk/client/rust" = ["sdk/client/rust/Cargo.toml"]
"share/ose/sdk/client/rust/src" = ["sdk/client/rust/src/*.rs"]

"share/ose/sdk/java/org/sdlose" = ["sdk/java/org/sdlose/*.java"]
"share/ose/sdk/ada" = ["sdk/ada/*.ads", "sdk/ada/*.adb"]
"share/ose/sdk/client/java" = ["sdk/client/java/*.c"]
"share/ose/sdk/client/java/org/sdlose/client" = ["sdk/client/java/org/sdlose/client/*.java"]
"share/ose/sdk/client/ada" = ["sdk/client/ada/*.ads", "sdk/client/ada/*.adb", "sdk/client/ada/*.c"]
