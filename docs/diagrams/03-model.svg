<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img"><title>Catalogue, context and recording model</title><desc>SDL design diagram. Editable source: sdl-design.drawio, page Catalogue, context and recording model.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#60758b" stroke="#60758b" stroke-width="1.5" /></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758b" stroke-width="1.5" /></marker></defs><rect x="0" y="0" width="1600" height="1260" fill="white" /><text x="48" y="39.375" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="bold" stroke="none">SDL DESIGN / STATIC / 03</text><text x="48" y="98.25" font-family="Arial, sans-serif" font-size="30" fill="#16324f" text-anchor="start" font-weight="bold" stroke="none">Catalogue, context and recording model</text><text x="48" y="142.0" font-family="Arial, sans-serif" font-size="16" fill="#526578" text-anchor="start" font-weight="normal" stroke="none">Logical entities and associations; exact class names and storage vary by backend.</text><rect x="40" y="1100" width="1520" height="130" rx="9" fill="#fff9e9" stroke="#d1bb7e" stroke-width="1.5" /><text x="58" y="1130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Design notes</text><text x="58" y="1160.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Field IDs drive schema evolution; wire message IDs are 1-based positions within a catalogue. A 32-bit catalogue hash may collide and is not a file schema ID.</text><text x="58" y="1179.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">A recording channel has one immutable catalogue and root. New versions use new channels; complete catalogue text is deduplicated within a file.</text><rect x="60" y="220" width="390" height="125" rx="9" fill="#f0eafa" stroke="#8060ae" stroke-width="1.5" /><text x="78" y="250" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Local type metadata</text><text x="78" y="280.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Logical type names</text><text x="78" y="299.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Fields, defaults, language representation</text><text x="78" y="319.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">C descriptors / Rust TypeInfo / classes</text><rect x="600" y="220" width="380" height="125" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="618" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">SDL2 catalogue</text><text x="618" y="280.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Exact canonical UTF-8 text</text><text x="618" y="301.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Message declarations and enums</text><text x="618" y="322.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Wire representation metadata</text><rect x="1140" y="220" width="400" height="125" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="1158" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Message declaration</text><text x="1158" y="280.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Logical name</text><text x="1158" y="301.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Catalogue-relative message ID</text><text x="1158" y="322.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Ordered fields</text><rect x="1140" y="455" width="400" height="125" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="1158" y="485" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Field declaration</text><text x="1158" y="515.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Stable field ID + name + logical type</text><text x="1158" y="534.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Cardinality and fixed dimensions</text><text x="1158" y="554.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">bits / q / encoding / align / padding</text><polyline points="980,282.5 1140,282.5" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1129.0,286.5 1140,282.5 1129.0,278.5" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="996.0" y="252.5" width="128" height="25" fill="#ffffff" /><text x="1060.0" y="270.25" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">contains 1..N</text><polyline points="1340.0,345 1340.0,455" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1336.0,444.0 1340.0,455 1344.0,444.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1276.0" y="370.0" width="128" height="25" fill="#ffffff" /><text x="1340.0" y="387.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">contains 0..N</text><rect x="600" y="455" width="380" height="125" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="618" y="485" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Prepared codec context</text><text x="618" y="515.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Parsed catalogue + root ID lookup</text><text x="618" y="534.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Remote-to-local field mappings</text><text x="618" y="554.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Cached fixed layouts / codec plans</text><polyline points="790.0,345 790.0,455" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="786.0,444.0 790.0,455 794.0,444.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="740.0" y="370.0" width="100" height="25" fill="#ffffff" /><text x="790.0" y="387.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">prepare</text><polyline points="255.0,345 255,402 790,402 790.0,455" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="786.0,444.0 790.0,455 794.0,444.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="458.5" y="372.0" width="128" height="25" fill="#ffffff" /><text x="522.5" y="389.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">typed mapping</text><rect x="60" y="720" width="390" height="125" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="78" y="750" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">SDL2 payload</text><text x="78" y="780.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Message type ID + positional values</text><text x="78" y="801.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Catalogue stays separate</text><text x="78" y="822.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Numeric byte order: big endian</text><polyline points="790.0,580 790,655 255,655 255.0,720" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="251.0,709.0 255.0,720 259.0,709.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="450.5" y="625.0" width="144" height="25" fill="#ffffff" /><text x="522.5" y="642.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">encode / decode</text><rect x="1140" y="720" width="400" height="125" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="1158" y="750" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Recording channel</text><text x="1158" y="780.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Local channel ID + topic + root name</text><text x="1158" y="801.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">One catalogue reference</text><text x="1158" y="822.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Channel metadata</text><polyline points="1340,720 1340,650 1040,650 1040,395 950,395 950,345" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="954.0,356.0 950,345 946.0,356.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1130.0" y="620.0" width="120" height="25" fill="#ffffff" /><text x="1190.0" y="637.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">references 1</text><rect x="600" y="920" width="380" height="120" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="618" y="950" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Recording record</text><text x="618" y="980.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Channel reference + unchanged payload</text><text x="618" y="999.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Log time + publish time (uint64 ns)</text><text x="618" y="1019.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Sequence (uint32)</text><polyline points="255.0,845 255,885 790,885 790.0,920" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="786.0,909.0 790.0,920 794.0,909.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="450.5" y="855.0" width="144" height="25" fill="#ffffff" /><text x="522.5" y="872.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">preserved bytes</text><polyline points="1340,845 1340,885 1040,885 1040,980 980,980" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="991.0,976.0 980,980 991.0,984.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1130.0" y="855.0" width="120" height="25" fill="#ffffff" /><text x="1190.0" y="872.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">0..N records</text></svg>