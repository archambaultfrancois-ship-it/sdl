<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img"><title>Connection setup and message exchange</title><desc>SDL design diagram. Editable source: sdl-design.drawio, page Connection setup and message exchange.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#60758b" stroke="#60758b" stroke-width="1.5" /></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758b" stroke-width="1.5" /></marker></defs><rect x="0" y="0" width="1600" height="1260" fill="white" /><text x="48" y="39.375" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="bold" stroke="none">SDL DESIGN / DYNAMIC / 04</text><text x="48" y="98.25" font-family="Arial, sans-serif" font-size="30" fill="#16324f" text-anchor="start" font-weight="bold" stroke="none">Connection setup and message exchange</text><text x="48" y="142.0" font-family="Arial, sans-serif" font-size="16" fill="#526578" text-anchor="start" font-weight="normal" stroke="none">One direction of a direct SDL2 connection; API labels are language-neutral.</text><rect x="40" y="1100" width="1520" height="130" rx="9" fill="#fff9e9" stroke="#d1bb7e" stroke-width="1.5" /><text x="58" y="1130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Design notes</text><text x="58" y="1160.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Prepare and reuse a context per direction. A comparison preflight may precede prepare; it does not replace payload validation. Reverse traffic repeats this setup.</text><text x="58" y="1179.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Typed decode maps field IDs, validates skipped fields and supplies missing local defaults. Malformed catalogues or data return backend errors; dynamic decode needs no local</text><text x="58" y="1199.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">classes.</text><rect x="40" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="58" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Sender application</text><polyline points="160,235 160,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="350" y="175" width="240" height="60" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="368" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Sender codec</text><polyline points="470,235 470,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="680" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="698" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Transport / framing</text><polyline points="800,235 800,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="1010" y="175" width="240" height="60" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="1028" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Receiver codec</text><polyline points="1130,235 1130,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="1320" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="1338" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Receiver application</text><polyline points="1440,235 1440,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><polyline points="160,280 470,280" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="459.0,284.0 470,280 459.0,276.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="195.0" y="250.0" width="240" height="25" fill="#ffffff" /><text x="315.0" y="267.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">1. description(local types)</text><polyline points="470,325 160,325" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="171.0,321.0 160,325 171.0,329.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="207.0" y="295.0" width="216" height="25" fill="#ffffff" /><text x="315.0" y="312.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">canonical SDL2 catalogue</text><polyline points="160,370 470,370" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="459.0,374.0 470,370 459.0,366.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="195.0" y="340.0" width="240" height="25" fill="#ffffff" /><text x="315.0" y="357.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">2. prepare(local catalogue)</text><polyline points="160,415 800,415" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="789.0,419.0 800,415 789.0,411.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="356.0" y="385.0" width="248" height="25" fill="#ffffff" /><text x="480.0" y="402.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">3. send catalogue at opening</text><polyline points="800,460 1440,460" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1429.0,464.0 1440,460 1429.0,456.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1036.0" y="430.0" width="168" height="25" fill="#ffffff" /><text x="1120.0" y="447.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">received catalogue</text><polyline points="1440,505 1130,505" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1141.0,501.0 1130,505 1141.0,509.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1149.0" y="475.0" width="272" height="25" fill="#ffffff" /><text x="1285.0" y="492.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">4. prepare(remote, local types)</text><polyline points="1130,550 1440,550" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="1429.0,554.0 1440,550 1429.0,546.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="1169.0" y="520.0" width="232" height="25" fill="#ffffff" /><text x="1285.0" y="537.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">reusable receiving context</text><rect x="40" y="600" width="1520" height="34" fill="#eef3f8" /><text x="48" y="622.25" font-family="Arial, sans-serif" font-size="14" fill="#35526e" text-anchor="start" font-weight="bold" stroke="none">FOR EACH MESSAGE / catalogue is not repeated</text><polyline points="160,665 470,665" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="459.0,669.0 470,665 459.0,661.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="203.0" y="635.0" width="224" height="25" fill="#ffffff" /><text x="315.0" y="652.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">5. encode(context, value)</text><polyline points="470,710 522,710 522,734 470,734" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="481.0,730.0 470,734 481.0,738.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="532" y="701" width="290" height="42" fill="#ffffff" /><text x="540" y="718.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Validate values; serialize</text><text x="540" y="736.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">using the sender layout</text><polyline points="470,770 160,770" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="171.0,766.0 160,770 171.0,774.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="207.0" y="740.0" width="216" height="25" fill="#ffffff" /><text x="315.0" y="757.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">type ID + encoded values</text><polyline points="160,815 800,815" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="789.0,819.0 800,815 789.0,811.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="388.0" y="785.0" width="184" height="25" fill="#ffffff" /><text x="480.0" y="802.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">6. send framed bytes</text><polyline points="800,860 1440,860" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1429.0,864.0 1440,860 1429.0,856.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1020.0" y="830.0" width="200" height="25" fill="#ffffff" /><text x="1120.0" y="847.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">received message bytes</text><polyline points="1440,905 1130,905" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1141.0,901.0 1130,905 1141.0,909.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1173.0" y="875.0" width="224" height="25" fill="#ffffff" /><text x="1285.0" y="892.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">7. decode(context, bytes)</text><polyline points="1130,950 1182,950 1182,974 1130,974" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1141.0,970.0 1130,974 1141.0,978.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1192" y="941" width="290" height="42" fill="#ffffff" /><text x="1200" y="958.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Read sender layout; map fields;</text><text x="1200" y="976.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">validate full consumption</text><polyline points="1130,1020 1440,1020" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="1429.0,1024.0 1440,1020 1429.0,1016.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="1173.0" y="990.0" width="224" height="25" fill="#ffffff" /><text x="1285.0" y="1007.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">local typed value / error</text></svg>