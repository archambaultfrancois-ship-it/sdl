<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img"><title>Codecs and service implementations</title><desc>SDL design diagram. Editable source: sdl-design.drawio, page Codecs and service implementations.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#60758b" stroke="#60758b" stroke-width="1.5" /></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758b" stroke-width="1.5" /></marker></defs><rect x="0" y="0" width="1600" height="1260" fill="white" /><text x="48" y="39.375" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="bold" stroke="none">SDL DESIGN / STATIC / 02</text><text x="48" y="98.25" font-family="Arial, sans-serif" font-size="30" fill="#16324f" text-anchor="start" font-weight="bold" stroke="none">Codecs and service implementations</text><text x="48" y="142.0" font-family="Arial, sans-serif" font-size="16" fill="#526578" text-anchor="start" font-weight="normal" stroke="none">Implementation boundaries and language gateways; columns are independent API families.</text><rect x="40" y="1100" width="1520" height="130" rx="9" fill="#fff9e9" stroke="#d1bb7e" stroke-width="1.5" /><text x="58" y="1130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Design notes</text><text x="58" y="1160.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Applications call both their codec and the required services. A JNI or MEX service gateway does not replace the Java or MATLAB codec.</text><text x="58" y="1179.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Recording passes existing encoded bytes to its engine; it needs no generated Rust message bindings. Python recording is a separate implementation.</text><text x="68" y="209.25" font-family="Arial, sans-serif" font-size="18" fill="#243b53" text-anchor="start" font-weight="bold" stroke="none">CODEC BACKENDS</text><text x="578" y="209.25" font-family="Arial, sans-serif" font-size="18" fill="#243b53" text-anchor="start" font-weight="bold" stroke="none">FILTER ENGINE</text><text x="1108" y="209.25" font-family="Arial, sans-serif" font-size="18" fill="#243b53" text-anchor="start" font-weight="bold" stroke="none">RECORDING ENGINES</text><rect x="60" y="250" width="440" height="90" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="78" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">C99</text><text x="78" y="310.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Descriptors + registry</text><text x="78" y="331.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Typed / dynamic codecs</text><rect x="60" y="365" width="440" height="90" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="78" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Rust</text><text x="78" y="425.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">SdlMessage + TypeInfo</text><text x="78" y="446.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Typed / dynamic codecs</text><rect x="60" y="480" width="440" height="90" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="78" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Python</text><text x="78" y="540.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Classes + runtime</text><text x="78" y="561.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Typed / dynamic; native packed buffers</text><rect x="60" y="595" width="440" height="90" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="78" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Java</text><text x="78" y="655.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Generated classes + SdlCodec</text><text x="78" y="676.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Java codec; primitive packed arrays</text><rect x="60" y="710" width="440" height="90" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="78" y="740" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Ada</text><text x="78" y="770.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Generated direct codecs</text><text x="78" y="791.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">C context + dynamic fallback</text><rect x="60" y="825" width="440" height="90" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="78" y="855" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">MATLAB / Octave</text><text x="78" y="885.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Generated functions + MATLAB runtime</text><text x="78" y="906.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Fixed codecs; selected example MEX paths</text><rect x="570" y="250" width="460" height="115" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="588" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Rust predicate engine</text><text x="588" y="310.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">runtime/rust/src/filter</text><text x="588" y="331.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Prepared expressions; object / wire readers</text><text x="588" y="352.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Direct API for Rust applications</text><rect x="570" y="430" width="460" height="90" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="588" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Filter C ABI</text><text x="588" y="490.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">runtime/filter/src/lib.rs</text><text x="588" y="511.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">libsdl_filter: opaque predicate handles</text><rect x="570" y="590" width="460" height="125" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="588" y="620" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Language adapters</text><text x="588" y="650.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">C native reader / CPython extension</text><text x="588" y="671.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Java JNI / Ada bindings / MATLAB MEX</text><text x="588" y="692.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Translate local values and diagnostics</text><polyline points="800.0,430 800.0,365" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="804.0,376.0 800.0,365 796.0,376.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="750.0" y="367.5" width="100" height="25" fill="#ffffff" /><text x="800.0" y="385.25" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">delegates</text><polyline points="800.0,590 800.0,520" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="804.0,531.0 800.0,520 796.0,531.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="750.0" y="525.0" width="100" height="25" fill="#ffffff" /><text x="800.0" y="542.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">calls</text><rect x="570" y="825" width="460" height="125" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="588" y="855" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Shared evaluation contract</text><text x="588" y="885.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Match / NoMatch / Indeterminate / Error</text><text x="588" y="906.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">No automatic keep/drop decision</text><text x="588" y="927.24" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Wire reader accesses selected values</text><rect x="1100" y="250" width="440" height="115" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="1118" y="280" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Native Rust recording</text><text x="1118" y="310.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">runtime/recording/src/lib.rs</text><text x="1118" y="329.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Rust MCAP SDK + SDL PCAPNG module</text><text x="1118" y="349.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Rust dynamic runtime validates payloads</text><rect x="1100" y="430" width="440" height="100" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="1118" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Recording C ABI + gateways</text><text x="1118" y="490.0" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">C ABI / Java JNI / Ada / C MEX</text><text x="1118" y="511.12" font-family="Arial, sans-serif" font-size="16" fill="#243b53" stroke="none">Rust applications call engine directly</text><polyline points="1320.0,430 1320.0,365" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1324.0,376.0 1320.0,365 1316.0,376.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1270.0" y="367.5" width="100" height="25" fill="#ffffff" /><text x="1320.0" y="385.25" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">calls</text><rect x="1100" y="630" width="440" height="125" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="1118" y="660" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Python recording</text><text x="1118" y="690.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">runtime/python/sdl_recording.py</text><text x="1118" y="709.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Python MCAP SDK + sdl_pcapng.py</text><text x="1118" y="729.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Python dynamic runtime validates payloads</text><rect x="1100" y="885" width="440" height="110" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="1118" y="915" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Shared recording profiles</text><text x="1118" y="945.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">MCAP: sdl2-recording-v1</text><text x="1118" y="964.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">PCAPNG: sdl2-recording-pcapng-v1</text><text x="1118" y="984.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Catalogues + unchanged SDL2 payloads</text><polyline points="1320.0,755 1320.0,885" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1316.0,874.0 1320.0,885 1324.0,874.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1260.0" y="790.0" width="120" height="25" fill="#ffffff" /><text x="1320.0" y="807.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">read / write</text><polyline points="1540,308 1570,308 1570,940 1540,940" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1551.0,936.0 1540,940 1551.0,944.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /></svg>