<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img"><title>Recording lifecycle</title><desc>SDL design diagram. Editable source: sdl-design.drawio, page Recording lifecycle.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#60758b" stroke="#60758b" stroke-width="1.5" /></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758b" stroke-width="1.5" /></marker></defs><rect x="0" y="0" width="1600" height="1260" fill="white" /><text x="48" y="39.375" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="bold" stroke="none">SDL DESIGN / DYNAMIC / 06</text><text x="48" y="98.25" font-family="Arial, sans-serif" font-size="30" fill="#16324f" text-anchor="start" font-weight="bold" stroke="none">Recording lifecycle</text><text x="48" y="142.0" font-family="Arial, sans-serif" font-size="16" fill="#526578" text-anchor="start" font-weight="normal" stroke="none">Writer protocol shared by Python and native recording engines.</text><rect x="40" y="1100" width="1520" height="130" rx="9" fill="#fff9e9" stroke="#d1bb7e" stroke-width="1.5" /><text x="58" y="1130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Design notes</text><text x="58" y="1160.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">write_encoded preserves the payload bytes. Body validation is enabled by default; disabling it still retains root and size checks. Writers are synchronous.</text><text x="58" y="1179.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">MCAP writes uncompressed chunks and indexes; PCAPNG writes one USER0 packet per record. Closing finalizes the file and reports IO errors; flush alone is not close.</text><rect x="40" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="58" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Acquisition application</text><polyline points="160,235 160,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="350" y="175" width="240" height="60" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="368" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Language codec</text><polyline points="470,235 470,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="680" y="175" width="240" height="60" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="698" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Recording writer</text><polyline points="800,235 800,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="1010" y="175" width="240" height="60" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="1028" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Container backend</text><polyline points="1130,235 1130,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="1320" y="175" width="240" height="60" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="1338" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">MCAP / PCAPNG file</text><polyline points="1440,235 1440,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><polyline points="160,275 800,275" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="789.0,279.0 800,275 789.0,271.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="340.0" y="245.0" width="280" height="25" fill="#ffffff" /><text x="480.0" y="262.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">1. open writer(format, metadata)</text><polyline points="800,320 1130,320" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1119.0,324.0 1130,320 1119.0,316.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="865.0" y="290.0" width="200" height="25" fill="#ffffff" /><text x="965.0" y="307.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">start selected profile</text><polyline points="1130,365 1440,365" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1429.0,369.0 1440,365 1429.0,361.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1157.0" y="335.0" width="256" height="25" fill="#ffffff" /><text x="1285.0" y="352.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">header + application metadata</text><polyline points="160,410 800,410" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="789.0,414.0 800,410 789.0,406.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="296.0" y="380.0" width="368" height="25" fill="#ffffff" /><text x="480.0" y="397.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">2. register_channel(topic, catalogue, root)</text><polyline points="800,455 852,455 852,479 800,479" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="811.0,475.0 800,479 811.0,483.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="862" y="446" width="290" height="42" fill="#ffffff" /><text x="870" y="463.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Prepare catalogue; deduplicate text;</text><text x="870" y="481.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">allocate schema / channel IDs</text><polyline points="800,510 1130,510" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1119.0,514.0 1130,510 1119.0,506.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="829.0" y="480.0" width="272" height="25" fill="#ffffff" /><text x="965.0" y="497.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">schema and channel declarations</text><polyline points="1130,555 1440,555" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1429.0,559.0 1440,555 1429.0,551.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1161.0" y="525.0" width="248" height="25" fill="#ffffff" /><text x="1285.0" y="542.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">declarations before messages</text><rect x="40" y="590" width="1520" height="34" fill="#eef3f8" /><text x="48" y="612.25" font-family="Arial, sans-serif" font-size="14" fill="#35526e" text-anchor="start" font-weight="bold" stroke="none">FOR EACH ACQUIRED MESSAGE</text><polyline points="160,645 470,645" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="459.0,649.0 470,645 459.0,641.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="203.0" y="615.0" width="224" height="25" fill="#ffffff" /><text x="315.0" y="632.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">3. encode(context, value)</text><polyline points="470,685 160,685" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="171.0,681.0 160,685 171.0,689.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="255.0" y="655.0" width="120" height="25" fill="#ffffff" /><text x="315.0" y="672.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">SDL2 payload</text><polyline points="160,725 800,725" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="789.0,729.0 800,725 789.0,721.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="292.0" y="695.0" width="376" height="25" fill="#ffffff" /><text x="480.0" y="712.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">4. write_encoded(channel, bytes, times, seq)</text><polyline points="800,765 852,765 852,789 800,789" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="811.0,785.0 800,789 811.0,793.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="862" y="756" width="290" height="42" fill="#ffffff" /><text x="870" y="773.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Check root, bounds and body</text><text x="870" y="791.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Keep original payload bytes</text><polyline points="800,820 1130,820" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1119.0,824.0 1130,820 1119.0,816.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="817.0" y="790.0" width="296" height="25" fill="#ffffff" /><text x="965.0" y="807.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">message + log / publish timestamps</text><polyline points="1130,860 1440,860" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1429.0,864.0 1440,860 1429.0,856.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1157.0" y="830.0" width="256" height="25" fill="#ffffff" /><text x="1285.0" y="847.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">MCAP chunk / PCAPNG EPB + CRC</text><rect x="40" y="895" width="1520" height="34" fill="#eef3f8" /><text x="48" y="917.25" font-family="Arial, sans-serif" font-size="14" fill="#35526e" text-anchor="start" font-weight="bold" stroke="none">FINALIZATION</text><polyline points="160,950 800,950" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="789.0,954.0 800,950 789.0,946.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="428.0" y="920.0" width="104" height="25" fill="#ffffff" /><text x="480.0" y="937.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">5. close()</text><polyline points="800,990 1130,990" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1119.0,994.0 1130,990 1119.0,986.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="833.0" y="960.0" width="264" height="25" fill="#ffffff" /><text x="965.0" y="977.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">finish container; flush output</text><polyline points="1130,1030 1440,1030" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1429.0,1034.0 1440,1030 1429.0,1026.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1117.0" y="1000.0" width="336" height="25" fill="#ffffff" /><text x="1285.0" y="1017.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">MCAP indexes + final magic / PCAPNG END</text></svg>