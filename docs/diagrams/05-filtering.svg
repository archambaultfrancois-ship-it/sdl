<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img"><title>Predicate preparation and evaluation</title><desc>SDL design diagram. Editable source: sdl-design.drawio, page Predicate preparation and evaluation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#60758b" stroke="#60758b" stroke-width="1.5" /></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758b" stroke-width="1.5" /></marker></defs><rect x="0" y="0" width="1600" height="1260" fill="white" /><text x="48" y="39.375" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="bold" stroke="none">SDL DESIGN / DYNAMIC / 05</text><text x="48" y="98.25" font-family="Arial, sans-serif" font-size="30" fill="#16324f" text-anchor="start" font-weight="bold" stroke="none">Predicate preparation and evaluation</text><text x="48" y="142.0" font-family="Arial, sans-serif" font-size="16" fill="#526578" text-anchor="start" font-weight="normal" stroke="none">The application evaluates either a message object or encoded SDL2 bytes.</text><rect x="40" y="1100" width="1520" height="130" rx="9" fill="#fff9e9" stroke="#d1bb7e" stroke-width="1.5" /><text x="58" y="1130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Design notes</text><text x="58" y="1160.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Wire filtering validates the root and accessed values; use the full decoder to validate untouched variable fields. Quantized wire values may differ from object values.</text><text x="58" y="1179.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Python encode_filtered / decode_filtered return codec output plus status; they still run the codec. The application chooses which statuses to retain.</text><rect x="40" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="58" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Application</text><polyline points="160,235 160,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="440" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="458" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Language adapter</text><polyline points="560,235 560,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="880" y="175" width="240" height="60" rx="9" fill="#e6f4ed" stroke="#378165" stroke-width="1.5" /><text x="898" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Rust filter engine</text><polyline points="1000,235 1000,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="1320" y="175" width="240" height="60" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="1338" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Object / wire source</text><polyline points="1440,235 1440,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><polyline points="160,280 560,280" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="549.0,284.0 560,280 549.0,276.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="192.0" y="250.0" width="336" height="25" fill="#ffffff" /><text x="360.0" y="267.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">1. prepare(catalogue, root, expression)</text><polyline points="560,330 1000,330" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="989.0,334.0 1000,330 989.0,326.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="696.0" y="300.0" width="168" height="25" fill="#ffffff" /><text x="780.0" y="317.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">prepare expression</text><polyline points="1000,380 1052,380 1052,404 1000,404" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1011.0,400.0 1000,404 1011.0,408.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1062" y="371" width="290" height="42" fill="#ffffff" /><text x="1070" y="388.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Parse; type-check; bind fields</text><text x="1070" y="406.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Compile reusable predicate</text><polyline points="1000,445 560,445" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="571.0,441.0 560,445 571.0,449.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="644.0" y="415.0" width="272" height="25" fill="#ffffff" /><text x="780.0" y="432.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">prepared predicate / diagnostic</text><polyline points="560,495 160,495" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="171.0,491.0 160,495 171.0,499.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="284.0" y="465.0" width="152" height="25" fill="#ffffff" /><text x="360.0" y="482.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">predicate handle</text><rect x="40" y="550" width="1520" height="34" fill="#eef3f8" /><text x="48" y="572.25" font-family="Arial, sans-serif" font-size="14" fill="#35526e" text-anchor="start" font-weight="bold" stroke="none">FOR EACH EVALUATION / prepared predicate is reused</text><polyline points="160,615 560,615" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="549.0,619.0 560,615 549.0,611.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="176.0" y="585.0" width="368" height="25" fill="#ffffff" /><text x="360.0" y="602.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">2. evaluate(object) OR evaluate_wire(bytes)</text><polyline points="560,665 1000,665" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="989.0,669.0 1000,665 989.0,661.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="664.0" y="635.0" width="232" height="25" fill="#ffffff" /><text x="780.0" y="652.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">predicate + source adapter</text><polyline points="1000,715 1440,715" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1429.0,719.0 1440,715 1429.0,711.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1048.0" y="685.0" width="344" height="25" fill="#ffffff" /><text x="1220.0" y="702.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">3. load required fields / array elements</text><polyline points="1440,765 1000,765" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="1011.0,761.0 1000,765 1011.0,769.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="1072.0" y="735.0" width="296" height="25" fill="#ffffff" /><text x="1220.0" y="752.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">logical values / missing / invalid</text><polyline points="1000,815 1052,815 1052,839 1000,839" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1011.0,835.0 1000,839 1011.0,843.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1062" y="806" width="290" height="42" fill="#ffffff" /><text x="1070" y="823.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Evaluate arithmetic and logic</text><text x="1070" y="841.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Short-circuit where possible</text><polyline points="1000,880 560,880" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="571.0,876.0 560,880 571.0,884.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="680.0" y="850.0" width="200" height="25" fill="#ffffff" /><text x="780.0" y="867.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">4. status + diagnostic</text><polyline points="560,930 160,930" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="171.0,926.0 160,930 171.0,934.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="192.0" y="900.0" width="336" height="25" fill="#ffffff" /><text x="360.0" y="917.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">Match / NoMatch / Indeterminate / Error</text><polyline points="160,990 212,990 212,1014 160,1014" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="171.0,1010.0 160,1014 171.0,1018.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="222" y="981" width="290" height="42" fill="#ffffff" /><text x="230" y="998.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">5. Apply application policy</text><text x="230" y="1016.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Keep, discard or report</text></svg>