<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img"><title>Catalogue resolution in the TCP pub/sub demo</title><desc>SDL design diagram. Editable source: sdl-design.drawio, page Catalogue resolution in the TCP pub/sub demo.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#60758b" stroke="#60758b" stroke-width="1.5" /></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758b" stroke-width="1.5" /></marker></defs><rect x="0" y="0" width="1600" height="1260" fill="white" /><text x="48" y="39.375" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="bold" stroke="none">SDL DESIGN / DYNAMIC / 08</text><text x="48" y="98.25" font-family="Arial, sans-serif" font-size="30" fill="#16324f" text-anchor="start" font-weight="bold" stroke="none">Catalogue resolution in the TCP pub/sub demo</text><text x="48" y="142.0" font-family="Arial, sans-serif" font-size="16" fill="#526578" text-anchor="start" font-weight="normal" stroke="none">Python sample: immutable catalogues, one topic contract and a bounded in-memory history.</text><rect x="40" y="1100" width="1520" height="130" rx="9" fill="#fff9e9" stroke="#d1bb7e" stroke-width="1.5" /><text x="58" y="1130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243b53" stroke="none">Design notes</text><text x="58" y="1160.0" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">RPC uses length-prefixed JSON; payload envelopes are Base64. S2PS/2 carries catalogue ID + unchanged SDL2 bytes, not the catalogue itself.</text><text x="58" y="1179.8" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">Cache hits skip resolution. Unknown catalogues, collisions and history gaps return errors. The sample has one topic, 256 history entries, no restart persistence or delivery</text><text x="58" y="1199.6" font-family="Arial, sans-serif" font-size="15" fill="#243b53" stroke="none">guarantees.</text><rect x="40" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="58" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Publisher</text><polyline points="160,235 160,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="350" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="368" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Broker</text><polyline points="470,235 470,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="680" y="175" width="240" height="60" rx="9" fill="#fff2d6" stroke="#bc8933" stroke-width="1.5" /><text x="698" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Broker registry / history</text><polyline points="800,235 800,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="1010" y="175" width="240" height="60" rx="9" fill="#edf0f4" stroke="#65758b" stroke-width="1.5" /><text x="1028" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">Subscriber</text><polyline points="1130,235 1130,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><rect x="1320" y="175" width="240" height="60" rx="9" fill="#e8f0fe" stroke="#3971ba" stroke-width="1.5" /><text x="1338" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b53" stroke="none">CatalogueDecoder</text><polyline points="1440,235 1440,1080" fill="none" stroke="#b3c0cf" stroke-width="2" stroke-dasharray="6 4" /><polyline points="160,275 470,275" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="459.0,279.0 470,275 459.0,271.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="175.0" y="245.0" width="280" height="25" fill="#ffffff" /><text x="315.0" y="262.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">1. put_catalogue(id, exact text)</text><polyline points="470,320 522,320 522,344 470,344" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="481.0,340.0 470,344 481.0,348.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="532" y="311" width="290" height="42" fill="#ffffff" /><text x="540" y="328.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Verify ID / full-text collisions;</text><text x="540" y="346.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">check contract and compatibility</text><polyline points="470,380 800,380" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="789.0,384.0 800,380 789.0,376.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="483.0" y="350.0" width="304" height="25" fill="#ffffff" /><text x="635.0" y="367.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">store immutable catalogue + context</text><polyline points="470,425 160,425" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="171.0,421.0 160,425 171.0,429.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="167.0" y="395.0" width="296" height="25" fill="#ffffff" /><text x="315.0" y="412.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">registration accepted / diagnostic</text><rect x="40" y="470" width="1520" height="34" fill="#eef3f8" /><text x="48" y="492.25" font-family="Arial, sans-serif" font-size="14" fill="#35526e" text-anchor="start" font-weight="bold" stroke="none">PUBLICATION AND POLLING</text><polyline points="160,525 212,525 212,549 160,549" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="171.0,545.0 160,549 171.0,553.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="222" y="516" width="290" height="42" fill="#ffffff" /><text x="230" y="542.25" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">2. encode + pack S2PS/2 envelope</text><polyline points="160,580 470,580" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="459.0,584.0 470,580 459.0,576.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="179.0" y="550.0" width="272" height="25" fill="#ffffff" /><text x="315.0" y="567.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">publish(topic, Base64 envelope)</text><polyline points="470,625 522,625 522,649 470,649" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="481.0,645.0 470,649 481.0,653.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="532" y="616" width="290" height="42" fill="#ffffff" /><text x="540" y="633.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Resolve registered context;</text><text x="540" y="651.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">decode_dynamic validates body</text><polyline points="470,685 800,685" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="789.0,689.0 800,685 789.0,681.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="491.0" y="655.0" width="288" height="25" fill="#ffffff" /><text x="635.0" y="672.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">append event with broker sequence</text><polyline points="1130,730 470,730" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="481.0,726.0 470,730 481.0,734.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="704.0" y="700.0" width="192" height="25" fill="#ffffff" /><text x="800.0" y="717.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">3. poll(after=cursor)</text><polyline points="470,775 1130,775" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="1119.0,779.0 1130,775 1119.0,771.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="708.0" y="745.0" width="184" height="25" fill="#ffffff" /><text x="800.0" y="762.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">events / HISTORY_GAP</text><polyline points="1130,820 1440,820" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1429.0,824.0 1440,820 1429.0,816.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1197.0" y="790.0" width="176" height="25" fill="#ffffff" /><text x="1285.0" y="807.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">4. decode(envelope)</text><polyline points="1440,860 1492,860 1492,884 1440,884" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1451.0,880.0 1440,884 1451.0,888.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1090" y="851" width="335" height="42" fill="#ffffff" /><text x="1098" y="877.25" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Unpack envelope; lookup LRU</text><polyline points="1440,915 470,915" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="481.0,911.0 470,915 481.0,919.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="807.0" y="885.0" width="296" height="25" fill="#ffffff" /><text x="955.0" y="902.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">5. get_catalogue(id) on cache miss</text><polyline points="470,955 1440,955" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="1429.0,959.0 1440,955 1429.0,951.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="803.0" y="925.0" width="304" height="25" fill="#ffffff" /><text x="955.0" y="942.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">exact catalogue / CATALOGUE_UNKNOWN</text><polyline points="1440,995 1492,995 1492,1019 1440,1019" fill="none" stroke="#60758b" stroke-width="2" /><polygon points="1451.0,1015.0 1440,1019 1451.0,1023.0" fill="#60758b" stroke="#60758b" stroke-width="1.5" /><rect x="1090" y="986" width="335" height="42" fill="#ffffff" /><text x="1098" y="1003.5" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">Verify hash; prepare + cache;</text><text x="1098" y="1021.0" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="start" font-weight="normal" stroke="none">typed or dynamic decode</text><polyline points="1440,1060 1130,1060" fill="none" stroke="#60758b" stroke-width="2" stroke-dasharray="6 4" /><polyline points="1141.0,1056.0 1130,1060 1141.0,1064.0" fill="none" stroke="#60758b" stroke-width="1.5" /><rect x="1121.0" y="1030.0" width="328" height="25" fill="#ffffff" /><text x="1285.0" y="1047.75" font-family="Arial, sans-serif" font-size="14" fill="#243b53" text-anchor="middle" font-weight="normal" stroke="none">value; cursor advances only on success</text></svg>