name: SDL Chain
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Read SDL revision
        id: sdl
        run: python -c 'import json,os; d=json.load(open("sdl-dependency.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+d["revision"]+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: archambaultfrancois-ship-it/sdl
          ref: ${{ steps.sdl.outputs.revision }}
          path: build/sdl-dependency
          token: ${{ secrets.SDL_ACCESS_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ada toolchain
        run: sudo apt-get update && sudo apt-get install -y gnat
      - name: Install project
        run: python -m pip install .
      - name: Test
        run: make test SDL_ROOT="$PWD/build/sdl-dependency"
      - name: Installed SDK smoke test
        run: SDL_ROOT="$PWD/build/sdl-dependency" python tests/installed_sdk.py

  java7:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '7'
      - name: Read SDL revision
        id: sdl
        run: python -c 'import json,os; d=json.load(open("sdl-dependency.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+d["revision"]+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: archambaultfrancois-ship-it/sdl
          ref: ${{ steps.sdl.outputs.revision }}
          path: build/sdl-dependency
          token: ${{ secrets.SDL_ACCESS_TOKEN || github.token }}
      - run: make test-java SDL_ROOT="$PWD/build/sdl-dependency"
