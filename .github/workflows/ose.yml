name: OSE language SDKs
on:
  push:
    paths: ['ose/**', 'sdl/**', 'Makefile', '.github/workflows/ose.yml']
  pull_request:
    paths: ['ose/**', 'sdl/**', 'Makefile', '.github/workflows/ose.yml']
jobs:
  full:
    env:
      SDL_ROOT: ${{ github.workspace }}/sdl
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ada toolchain
        run: sudo apt-get update && sudo apt-get install -y gnat
      - name: Install package
        run: python -m pip install ./ose
      - name: Verify all languages and execution modes
        timeout-minutes: 10
        run: make -C ose test
      - name: Prepare optional recording and filtering services
        run: |
          make -C sdl recording-deps
          make -C sdl filter-python
      - name: Verify interactive recording
        run: make -C ose test-recording
      - name: Installed SDK smoke test
        run: python ose/tests/installed_sdk.py
  java7:
    env:
      SDL_ROOT: ${{ github.workspace }}/sdl
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '7'
      - name: Verify actual Java 7 compilation and execution
        run: make -C ose test-java
