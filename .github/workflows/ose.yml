name: OSE language SDKs
on:
  push:
    paths: ['ose/**', 'sdl/**', 'Makefile', '.github/workflows/ose.yml']
  pull_request:
    paths: ['ose/**', 'sdl/**', 'Makefile', '.github/workflows/ose.yml']
jobs:
  full:
    env:
      SDL_ROOT: ${{ github.workspace }}/sdl
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ada toolchain
        run: sudo apt-get update && sudo apt-get install -y gnat
      - name: Install package
        run: python -m pip install ./ose
      - name: Verify all languages and execution modes
        run: make -C ose check
      - name: Installed SDK smoke test
        run: python ose/tests/installed_sdk.py
  java7:
    env:
      SDL_ROOT: ${{ github.workspace }}/sdl
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '7'
      - name: Verify actual Java 7 compilation and execution
        run: make -C ose test-java
